# skrl AMP training config for the g1_stairs task.
#
# Read directly by scripts/train_amp_depth.py, which constructs WasabiAMP and the custom
# depth models in Python -- skrl's Runner/model-instantiator cannot build either (see that
# script's docstring). The `models:` block below is therefore descriptive of the architecture,
# not the thing that instantiates it.
#
# Field names target skrl 1.4.3 (task_reward_weight / style_reward_weight /
# amp_state_preprocessor / clip_predicted_values / "lambda"); later skrl branches renamed several
# of these, so check against the installed version, not the docs online.
#
# PPO hyperparameters are carried over from rl-wbc-g1-amp, itself cross-validated against
# rl-wbc-g1-baseline's rsl_rl config.

seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    fixed_log_std: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 128]
        activations: elu
    output: ONE
  discriminator:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

# reference motion dataset
motion_dataset:
  class: RandomMemory
  memory_size: 200000

# rollout replay, guards against discriminator overfitting
reply_buffer:
  class: RandomMemory
  memory_size: 1000000

agent:
  class: AMP
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  # no observation or value normalization, matching the rsl_rl baseline this line came from
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: null
  value_preprocessor_kwargs: null
  amp_state_preprocessor: RunningStandardScaler
  amp_state_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.008
  value_loss_scale: 1.0

  # Style reward rides alongside a full-weight task reward rather than trading off against it,
  # matching InstinctLab's discriminator_reward_coef of 0.25. The "quad" style reward is bounded
  # in [0, 1] before scaling, so style contributes at most 0.25 per step.
  task_reward_weight: 1.0
  style_reward_weight: 0.25
  discriminator_reward_scale: 1.0
  discriminator_loss_scale: 5.0
  amp_batch_size: 512
  discriminator_batch_size: 4096
  discriminator_logit_regularization_scale: 0.05
  discriminator_gradient_penalty_scale: 5.0
  discriminator_weight_decay_scale: 1.0e-04
  discriminator_gradient_tolerance: 0.0  # WASABI-specific, see agents/wasabi_amp.py

  # bootstrap the value at episode timeout, so a successful full-length episode is not
  # truncated the same way a fall is
  time_limit_bootstrap: True

  experiment:
    directory: "g1_stairs"
    experiment_name: ""
    write_interval: 100
    # 2400 timesteps = 100 PPO iterations at rollouts:24 -- a checkpoint (and therefore a video)
    # every 100 iterations for the 2026-09-08 diagnostic run.
    checkpoint_interval: 2400

trainer:
  class: SequentialTrainer
  # skrl counts timesteps in ENV STEPS, not PPO iterations: one update per `rollouts` steps,
  # so 240000 here is 10,000 iterations.
  timesteps: 240000
  environment_info: log
